name: Deploy editions

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      # The four editions are independent deploy targets (different repos, different
      # origins) — one failing (e.g. furever's EDITIONS_DEPLOY_PAT permission gap,
      # docs/LAUNCH_CHECKLIST.md §3) must never cancel the others mid-publish.
      # Without this, GitHub's default fail-fast races a cancel signal against an
      # in-flight job — seen in practice: lite/pro's own steps (incl. Publish) showed
      # "success" while the job itself got stamped "cancelled".
      fail-fast: false
      matrix:
        include:
          - edition: lite
            repo: NoliCommoveri/kennelos-lite
            domain: lite.kennelos.app
          - edition: pro
            repo: NoliCommoveri/kennelos-pro
            domain: pro.kennelos.app
          - edition: demo
            repo: NoliCommoveri/kennelos-demo
            domain: demo.kennelos.app
          # Furever is a standalone app (not an edition of the shared core);
          # assemble.mjs builds it off furever/ via its standalone path. This leg
          # only publishes once EDITIONS_DEPLOY_PAT has Contents:Read/Write on
          # NoliCommoveri/KennelOS-Furever — until then it 403s on push (fail-fast:
          # false keeps that from cancelling lite/pro/demo). See LAUNCH_CHECKLIST §3.
          - edition: furever
            repo: NoliCommoveri/KennelOS-Furever
            domain: furever.kennelos.app
          # The marketing website at the apex domain — a plain static site (not an
          # app, not a PWA); assemble.mjs copies site/ verbatim. Same prerequisites
          # as the furever leg: the publish repo must exist, EDITIONS_DEPLOY_PAT must
          # have Contents:Read/Write on it, and Pages + DNS must point kennelos.app
          # at it. Until then this leg fails alone (fail-fast: false). See
          # LAUNCH_CHECKLIST §3.
          - edition: site
            repo: NoliCommoveri/kennelos-site
            domain: kennelos.app
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build ${{ matrix.edition }}
        # --release makes the launch-placeholder guard FAIL the build instead of just
        # warning, so a deploy can never ship an edition whose editionConfig still
        # carries a stand-in buy/upgrade URL. Restored alongside Pro's pay gate: with
        # the gate on, that guard protects the only way into the app, so a dead
        # checkout link is no longer a cosmetic problem. Note it scans editionConfig
        # ONLY — site/'s per-tier checkout links are not covered (LAUNCH_CHECKLIST §1).
        run: node build/assemble.mjs ${{ matrix.edition }} --release

      - name: Add CNAME
        run: echo "${{ matrix.domain }}" > dist/${{ matrix.edition }}/CNAME

      - name: Publish to ${{ matrix.repo }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.EDITIONS_DEPLOY_PAT }}
          external_repository: ${{ matrix.repo }}
          publish_branch: main
          publish_dir: dist/${{ matrix.edition }}
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy ${{ matrix.edition }}: ${{ github.sha }}'
