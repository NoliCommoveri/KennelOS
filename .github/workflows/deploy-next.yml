name: Deploy next (test build)

# The next channel (build/nextChannel.mjs, build/README.md "Next channel"): every push to
# the `next` branch publishes a test build of Pro to next-pro.kennelos.app. It talks only
# to the staging servers, has no license gate, and lives on its own origin, so its data and
# schema upgrades never reach anyone's real KennelOS. The live editions keep deploying from
# `main` (deploy.yml); nothing here touches them.

on:
  push:
    branches: [next]
  workflow_dispatch: {}

concurrency:
  group: deploy-next
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests (app and cloud)
        run: node --test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: pro
            repo: NoliCommoveri/kennelos-next-pro
            domain: next-pro.kennelos.app
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build ${{ matrix.edition }} (next channel)
        # Output goes to dist/next-<edition>/. The build fails if the config would still
        # point at a production server.
        run: node build/assemble.mjs ${{ matrix.edition }} --channel next --release

      - name: Add CNAME
        run: echo "${{ matrix.domain }}" > dist/next-${{ matrix.edition }}/CNAME

      - name: Publish to ${{ matrix.repo }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.EDITIONS_DEPLOY_PAT }}
          external_repository: ${{ matrix.repo }}
          publish_branch: main
          publish_dir: dist/next-${{ matrix.edition }}
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy next ${{ matrix.edition }}: ${{ github.sha }}'
