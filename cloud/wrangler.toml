# The KennelOS cloud backup API (docs/KennelOS_Cloud_Phase1_Plan.md §6).
# The editions stay on GitHub Pages and call this Worker cross-origin; it is the
# only thing that can reach D1 and R2. Deployed by Cloudflare Workers Builds with
# its root directory set to `cloud/` — never by deploy.yml.
#
# The top level is the STAGING Worker. [env.production] at the bottom is the
# production one (plan §6.7, §9 step 6): its own name, D1, R2 and custom domain,
# deployed by a second Workers Builds connection with the deploy command
# `npx wrangler deploy --env production`.
name = "kennelos-api-staging"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Worker logs are the only place the operator can see why something failed, and
# they read them in the dashboard. Nothing in src/ may log an email address, a
# code, a token or a request body (plan §6.4).
[observability]
enabled = true

# No [assets] block, on purpose: this Worker serves no files. If one is ever
# added, never set `not_found_handling = "404-page"` — it puts the asset layer in
# front of the Worker and /ops stops reaching the router (MCCE architecture §2).

[[d1_databases]]
binding = "DB"
database_name = "kennelos-api-staging"
database_id = "03cbff8d-a86f-45fe-ad78-c3debd30d613"

# Never public: every object is served through the Worker after an auth check.
[[r2_buckets]]
binding = "FILES"
bucket_name = "kennelos-files-staging"

# Migration .sql files are bundled as text so /ops can apply them. The glob must
# be `**/*.sql`: wrangler matches it against the import string
# ('./0001_schema.sql'), so `migrations/*.sql` would never match.
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

# MAIL_FROM: the sender for sign-in codes, on the domain verified in Resend.
# DEV_OUTBOX: staging only. Until the RESEND_API_KEY secret is set, sign-in
# codes are shown on /ops instead of emailed (src/mail.js). Production must NOT
# set it. The Resend key itself is a secret, set in the dashboard, never here.
#
# LS_*: the Pro license webhook (src/license.js; docs/KennelOS_License_Link_Plan.md
# §7). Ids from the Lemon Squeezy dashboard, comma-separated where there can be
# several. Variants not listed as yearly or lifetime count as monthly. Staging
# takes TEST-MODE purchases only, production live ones. Until LS_STORE_ID, a
# product id and the LEMONSQUEEZY_WEBHOOK_SECRET secret are set, the webhook
# answers 503 and /ops says what's missing.
[vars]
MAIL_FROM = "KennelOS <signin@kennelos.app>"
DEV_OUTBOX = "1"
LS_TEST_MODE = "true"
LS_STORE_ID = ""
LS_PRO_PRODUCT_IDS = ""
LS_YEARLY_VARIANT_IDS = ""
LS_LIFETIME_VARIANT_IDS = ""

# Daily retention (src/retention.js), 03:17 UTC. Cron runs in UTC and is never
# retried; retention is idempotent and /ops has "Run retention now".
[triggers]
crons = ["17 3 * * *"]

# --- Production (plan §6.7 step 6) -------------------------------------------
# Bindings, vars and triggers are not inherited by an environment, so each is
# restated here. No DEV_OUTBOX: production emails codes through Resend, and
# with no RESEND_API_KEY it refuses sign-in rather than pretending (src/mail.js).
# The secrets (OPS_TOKEN, EMAIL_HMAC_KEY, RESEND_API_KEY, LEMONSQUEEZY_WEBHOOK_SECRET) are set on this Worker
# separately in the dashboard; production's EMAIL_HMAC_KEY is permanent.
[env.production]
name = "kennelos-api"
workers_dev = false
routes = [{ pattern = "api.kennelos.app", custom_domain = true }]

[env.production.observability]
enabled = true

# The production D1 database (dashboard step 2), created 2026-10-07.
[[env.production.d1_databases]]
binding = "DB"
database_name = "kennelos-api"
database_id = "d99863b5-6c0c-4ef3-a0da-bba83a686c00"

[[env.production.r2_buckets]]
binding = "FILES"
bucket_name = "kennelos-files"

[env.production.vars]
MAIL_FROM = "KennelOS <signin@kennelos.app>"
LS_TEST_MODE = "false"
LS_STORE_ID = ""
LS_PRO_PRODUCT_IDS = ""
LS_YEARLY_VARIANT_IDS = ""
LS_LIFETIME_VARIANT_IDS = ""

[env.production.triggers]
crons = ["17 3 * * *"]
