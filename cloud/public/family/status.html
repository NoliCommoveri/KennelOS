<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Your waitlist page</title>
<link rel="stylesheet" href="/family/family.css">
<script type="module" src="/family/status.js"></script>
</head>
<body>
<main class="centered">
  <header class="page">
    <img class="kennel-logo" id="kennel-logo" alt="" hidden>
    <h1 id="title">Your waitlist page</h1>
    <p class="muted small" id="updated"></p>
    <div class="ornament" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="6.2" cy="10.2" rx="1.9" ry="2.4"/><ellipse cx="9.6" cy="6.4" rx="1.9" ry="2.5"/><ellipse cx="14.4" cy="6.4" rx="1.9" ry="2.5"/><ellipse cx="17.8" cy="10.2" rx="1.9" ry="2.4"/><path d="M12 11.2c-2.6 0-5.2 3.1-5.2 5.3 0 1.7 1.3 2.6 2.8 2.6 1 0 1.6-.5 2.4-.5s1.4.5 2.4.5c1.5 0 2.8-.9 2.8-2.6 0-2.2-2.6-5.3-5.2-5.3z"/></svg></div>
    <div id="signin-slot"></div>
  </header>
  <p id="error" class="card notice" hidden></p>
  <div class="tabs" role="tablist" id="tabs" hidden>
    <button type="button" role="tab" id="tab-mine" aria-selected="true" aria-controls="mine">My page</button>
    <button type="button" role="tab" id="tab-list" aria-selected="false" aria-controls="public">Public list</button>
  </div>
  <section id="mine" role="tabpanel" aria-labelledby="tab-mine" hidden></section>
  <section id="public" role="tabpanel" aria-labelledby="tab-list" hidden>
    <div class="card">
      <label for="search" class="small muted">Search the list</label>
      <input id="search" type="search" placeholder="Search by name or number" autocomplete="off">
    </div>
    <div class="card" id="list"></div>
  </section>
  <footer class="page">
    <div class="theme-pick" role="radiogroup" aria-label="Page colors">
      <span class="small muted">Colors:</span>
      <button type="button" role="radio" data-theme-pick="classic" aria-checked="true"><span class="sw sw-classic"></span>Classic</button>
      <button type="button" role="radio" data-theme-pick="ivory" aria-checked="false"><span class="sw sw-ivory"></span>Ivory</button>
      <button type="button" role="radio" data-theme-pick="blush" aria-checked="false"><span class="sw sw-blush"></span>Blush</button>
    </div>
    This page is just for you: anyone with its link can see it, so please don't share it.
  </footer>
</main>
</body>
</html>
